[project]
name = "signaloid-utilities"
version = "2.8.0"
description = ""
authors = [
    {name = "Signaloid", email = "info@signaloid.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.33,<3.0.0)",
    "urllib3 (>=2.7.0,<3)",
]


[tool.poetry]
packages = [
	{include = "signaloid_utilities", from = "src/python"},
]


[tool.poetry.group.dev.dependencies]
mypy = "^1.17.0"
flake8 = "^7.3.0"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"


[tool.mypy]
warn_unused_configs = true
strict = true

[[tool.mypy.overrides]]
module = [
	"signaloid_utilities.c0microsd.*",
	"signaloid_utilities.c0sd.*",
	"signaloid_utilities.sddev.*",
	"signaloid_utilities.signaloid_api.*",
]
disallow_untyped_calls = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_unused_ignores = false
check_untyped_defs = false
strict_equality = false
